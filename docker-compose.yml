# The three services. Nothing is published here: docker-compose.local.yml adds
# a port for running it on your own machine (that is what `make up` uses), and
# docker-compose.homelab.yml attaches it to a reverse proxy instead.

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    image: bananagrams/frontend:latest
    depends_on:
      - solver
      - segmentation
    restart: unless-stopped

  solver:
    build:
      context: .
      dockerfile: Dockerfile.solver
    image: bananagrams/solver:latest
    restart: unless-stopped

  segmentation:
    build:
      context: .
      dockerfile: Dockerfile.segmentation
    image: bananagrams/segmentation:latest
    environment:
      # Fetched once into the volume, then reused across restarts and rebuilds.
      - MODEL_DOWNLOAD_URL=${MODEL_DOWNLOAD_URL:-https://github.com/Zawaer/bananagrams-assistant/releases/download/models/yolo11x-seg-200epochs-100images-960.onnx}
      - MODEL_CACHE_DIR=/models
      # Drop the model from memory after this long without a photo.
      - IDLE_UNLOAD_SECONDS=${IDLE_UNLOAD_SECONDS:-600}
      # Word definitions (tap a word on the solved board) are fetched from
      # Kielitoimiston sanakirja once per word and kept here, in the volume.
      - DEFINE_CACHE_DIR=/models/ks-define
      # With a local copy of the dictionary (crawl-ks.py's cache), mount it
      # read-only, e.g. at /ks-local, and set KS_LOCAL_DIR=/ks-local: words
      # found there never reach the site. Never commit that copy.
    volumes:
      - models:/models
    restart: unless-stopped

volumes:
  models:
